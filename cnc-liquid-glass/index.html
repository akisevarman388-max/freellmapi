    <!-- Time binding. HyperFrames seeks a paused GSAP timeline registered on window.__timelines
         and dispatches hf-seek with the same time. Both feed one pure function: render(t).
         The single linear tween is only a clock, there are no keyframes. -->
    <script>
      (function () {
        var root = document.getElementById("root");
        var D = parseFloat(root.dataset.duration) || 34;
        var host = { D: D, render: null, lastT: NaN, pendingT: 0 };
        window.__cnc = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = new Promise(function (resolve) {
          host.ready = resolve;
        });
        host.draw = function (t) {
          host.pendingT = t;
          if (!host.render) return;
          if (t === host.lastT) return; // GSAP onUpdate and hf-seek report the same frame: draw once.
          host.lastT = t;
          host.render(t);
        };
        var clock = { t: 0 };
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: function () {
            host.draw(clock.t);
          },
        });
        window.addEventListener("hf-seek", function (e) {
          host.draw(e.detail.time);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
      import { Font } from "three/addons/loaders/FontLoader.js";
      import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
      import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

      const host = window.__cnc;
      const W = 1080;
      const H = 1920;
      const D = host.D;

      // ------------------------------------------------------------------ palette
      const HEX = { bg: "#07050f", primary: "#7A5CFF", light: "#B7A6FF", accent: "#D1FE17" };
      const C = (h, k = 1) => new THREE.Color(h).multiplyScalar(k);

      // ------------------------------------------------------------------ math (pure)
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const outBack = (x, s = 1.70158) => {
        const c3 = s + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
      };
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const inCubic = (x) => x * x * x;
      const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const smooth = (x) => x * x * (3 - 2 * x);
      const hash = (n) => {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      const wobble = (t, a, b, p) => 0.6 * Math.sin(t * a + p) + 0.4 * Math.sin(t * b + p * 2.3);

      // ------------------------------------------------------------------ story clock (seconds)
      const T = {
        hookImpact: 0.32,
        flip: [3.49, 4.11], // outBack(1.4) crosses 1 at 41.7% -> lands on "Нет." at 3.75
        s1Exit: [6.2, 6.82],
        cut1: 6.8,
        s2In: [6.72, 7.72],
        travel1: [7.9, 9.55],
        plunge: [9.55, 9.85],
        mill: [9.85, 12.8],
        retract: [12.8, 13.1],
        spOut: [13.1, 13.5],
        lzIn: [13.9, 14.5], // lock (outBack crossing) at 14.12 -> "и это лазер"
        travel2: [14.5, 14.85],
        engrave: [14.85, 16.95],
        travel3: [16.95, 17.15],
        cut: [17.15, 18.5],
        park: [18.55, 19.6],
        s2Exit: [21.75, 22.15],
        cut2: 22.05,
        s3In: [22.05, 22.95], // title lands at 22.38
        ctaIn: [26.9, 27.55],
        press: 29.6,
      };
      // the moment an outBack(s) move first reaches its target: the visible "hit"
      const backCross = (win, s) => win[0] + (1 - s / (s + 1)) * (win[1] - win[0]);
      const lockT = backCross(T.lzIn, 1.8);
      const titleLandT = backCross(T.s3In, 1.3);

      // Flash + shake events: 3D impacts plus every caption marked data-accent.
      const events = [
        { t: T.hookImpact, f: 1.0, s: 1.0 },
        { t: T.cut1 - 0.03, f: 0.85, s: 0.25 },
        { t: lockT, f: 0.9, s: 0.85 },
        { t: titleLandT, f: 1.0, s: 0.9 },
        { t: T.press, f: 0.6, s: 0.4 },
      ];
      const captions = [...document.querySelectorAll(".cap[id^='cap-']")].map((el, i) => ({
        el,
        plate: el.querySelector(".plate"),
        words: [...el.querySelectorAll(".w")],
        start: parseFloat(el.dataset.start),
        dur: parseFloat(el.dataset.duration),
        accent: el.dataset.accent === "1",
        mode: i % 2,
      }));
      for (const c of captions) {
        if (c.accent && !events.some((e) => Math.abs(e.t - c.start) < 0.15)) events.push({ t: c.start, f: 0.8, s: 0.7 });
      }
      const flashAt = (t) => {
        let f = 0;
        for (const e of events) {
          const x = t - e.t;
          if (x >= 0 && x < 0.9) f += e.f * Math.exp(-x / 0.11);
        }
        return Math.min(f, 1.2);
      };
      const shakeAt = (t) => {
        let s = 0;
        for (const e of events) {
          const x = t - e.t;
          if (x >= 0 && x < 0.7) s += e.s * Math.exp(-x / 0.13);
        }
        return s;
      };

      // ------------------------------------------------------------------ renderer
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.setClearColor(new THREE.Color(HEX.bg), 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);

      // ------------------------------------------------------------------ environment (PMREM)
      // A dark violet room lit only by glowing strips of the primary colour and white:
      // this is what the glass reflects and refracts at its edges.
      {
        const env = new THREE.Scene();
        env.add(
          new THREE.Mesh(
            new THREE.SphereGeometry(40, 32, 16),
            new THREE.MeshBasicMaterial({ color: C("#0a0716"), side: THREE.BackSide }),
          ),
        );
        const strip = (w, h, color, k, pos, rotX = 0) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: C(color, k), side: THREE.DoubleSide }),
          );
          m.position.copy(pos);
          m.lookAt(0, pos.y, 0);
          m.rotateX(rotX);
          env.add(m);
        };
        const ring = (deg, w, color, k, y = 0, h = 16) => {
          const a = THREE.MathUtils.degToRad(deg);
          strip(w, h, color, k, new THREE.Vector3(9 * Math.sin(a), y, 9 * Math.cos(a)));
        };
        ring(-38, 0.42, "#ffffff", 7);
        ring(28, 0.32, HEX.primary, 12);
        ring(70, 0.16, "#ffffff", 9);
        ring(128, 0.36, "#ffffff", 5);
        ring(196, 0.9, HEX.light, 4);
        ring(262, 0.22, "#ffffff", 8);
        ring(300, 0.42, HEX.primary, 10);
        // overhead softbox and a low violet horizon band
        const top = new THREE.Mesh(
          new THREE.PlaneGeometry(7, 0.7),
          new THREE.MeshBasicMaterial({ color: C("#ffffff", 3.0), side: THREE.DoubleSide }),
        );
        top.position.set(0, 9, 0);
        top.rotation.x = Math.PI / 2;
        env.add(top);
        const band = new THREE.Mesh(
          new THREE.CylinderGeometry(10, 10, 0.9, 64, 1, true),
          new THREE.MeshBasicMaterial({ color: C(HEX.primary, 3.2), side: THREE.DoubleSide }),
        );
        band.position.y = -3.2;
        env.add(band);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(env, 0.03).texture;
        scene.environmentIntensity = 1.0;
        pmrem.dispose();
      }

      // ------------------------------------------------------------------ background shader
      const bgMat = new THREE.ShaderMaterial({
        depthTest: false,
        depthWrite: false,
        uniforms: {
          uTime: { value: 0 },
          uFlash: { value: 0 },
          uScroll: { value: 0 },
          uAspect: { value: W / H },
          uBg: { value: C(HEX.bg) },
          uP: { value: C(HEX.primary) },
          uL: { value: C(HEX.light) },
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime, uFlash, uScroll, uAspect;
          uniform vec3 uBg, uP, uL;
          varying vec2 vUv;
          float h21(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
          // one flowing ribbon, repeated every 2.4 units across q.y so a scroll never empties the frame
          vec3 ribbon(vec2 q, float i, vec3 col, float bright) {
            float t = uTime;
            float fr = 1.05 + 0.27 * i;
            float sp = 0.13 + 0.04 * i;
            float y = 0.6 * i
              + 0.24 * sin(q.x * fr + t * sp + i * 1.7)
              + 0.08 * sin(q.x * fr * 2.3 - t * sp * 1.7 + i * 3.1);
            float d = q.y - y;

      // ------------------------------------------------------------------ tool paths (work coords: x right, z toward viewer)
      function makePath(polys) {
        const segs = [];
        let L = 0;
        let prev = null;
        for (const poly of polys) {
          if (prev) {
            const a = prev, b = poly[0];
            const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
            segs.push({ a, b, s0: L, len, on: false });
            L += len;
          }
          for (let i = 1; i < poly.length; i++) {
            const a = poly[i - 1], b = poly[i];
            const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
            if (len < 1e-6) continue;
            segs.push({ a, b, s0: L, len, on: true });
            L += len;
          }
          prev = poly[poly.length - 1];
        }
        return { segs, L, start: polys[0][0], end: prev };

          if (path.segs[mid].s0 <= s) lo = mid;
          else hi = mid - 1;
        }
        const g = path.segs[lo];
        const k = g.len > 0 ? clamp01((s - g.s0) / g.len) : 0;
        return { x: lerp(g.a[0], g.b[0], k), z: lerp(g.a[1], g.b[1], k), on: g.on };
      }

          [hw - r, -hd + r, 0],
          [-hw + r, -hd + r, -Math.PI / 2],
          [-hw + r, hd - r, -Math.PI],
        ];
        for (const [cx, cz, a0] of corners)
          for (let i = 0; i <= n; i++) {
            const a = a0 - (i / n) * (Math.PI / 2);
            pts.push([cx + r * Math.cos(a), cz + r * Math.sin(a)]);

        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

      }
      // tool point in machine coords for a given head state
      const toolPoint = (h, tipY) => [h.x, holderY + h.zh + tipY, h.z + WP.z];

      // ------------------------------------------------------------------ engraving canvas = f(t)
      const mapCtx = mapCanvas.getContext("2d");
      const glowCtx = glowCanvas.getContext("2d");
      const toPx = (v) => [(v[0] / WP.w + 0.5) * CW, (v[1] / WP.d + 0.5) * CH];
      function strokePath(ctx, path, p, style) {
        const sNow = clamp01(p) * path.L;
        ctx.beginPath();
        let open = false;
        for (const g of path.segs) {
          if (g.s0 >= sNow) break;
          if (!g.on) { open = false; continue; }
          const k = Math.min(1, (sNow - g.s0) / g.len);
          const a = toPx(g.a);
          const b = toPx([lerp(g.a[0], g.b[0], k), lerp(g.a[1], g.b[1], k)]);
          if (!open) { ctx.moveTo(a[0], a[1]); open = true; }
          ctx.lineTo(b[0], b[1]);
        }
        Object.assign(ctx, style);
        ctx.stroke();
      }
      function glowPath(ctx, path, t, win, width, tau) {
        const p = seg(t, ...win);
        if (p <= 0) return;
        const sNow = p * path.L;
        const dur = win[1] - win[0];
        ctx.lineCap = "round";
        ctx.lineWidth = width;
        for (const g of path.segs) {
          if (g.s0 >= sNow) break;
          if (!g.on) continue;
          const passT = win[0] + ((g.s0 + g.len * 0.5) / path.L) * dur;
          const age = Math.max(0, t - passT);
          const a = 0.95 * Math.exp(-age / tau) + 0.22 * Math.exp(-age / 3.5);
          if (a < 0.01) continue;
          const k = Math.min(1, (sNow - g.s0) / g.len);
          const pa = toPx(g.a);
          const pb = toPx([lerp(g.a[0], g.b[0], k), lerp(g.a[1], g.b[1], k)]);
          ctx.strokeStyle = `rgba(190,170,255,${a.toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(pa[0], pa[1]);
          ctx.lineTo(pb[0], pb[1]);
          ctx.stroke();
        }
      }
      let workKey = null;
      function drawWork(t) {
        // Before the first cut the board is clean: one key for all those frames. After it, every frame redraws from t.
        const key = t < T.mill[0] ? "clean" : t;
        if (key === workKey) return;
        workKey = key;
        mapCtx.drawImage(baseCanvas, 0, 0);
        const pm = seg(t, ...T.mill);
        if (pm > 0) {
          strokePath(mapCtx, millPath, pm, { strokeStyle: "#efeaff", lineWidth: 16, lineCap: "round", lineJoin: "round" });
          strokePath(mapCtx, millPath, pm, { strokeStyle: "#3b3160", lineWidth: 11, lineCap: "round", lineJoin: "round" });
          strokePath(mapCtx, millPath, pm, { strokeStyle: "#241c40", lineWidth: 5, lineCap: "round", lineJoin: "round" });
        }
        const pe = seg(t, ...T.engrave);
        if (pe > 0) strokePath(mapCtx, engravePath, pe, { strokeStyle: "#1d1533", lineWidth: 8, lineCap: "round", lineJoin: "round" });
        const pc = seg(t, ...T.cut);
        if (pc > 0) strokePath(mapCtx, cutPath, pc, { strokeStyle: "#120d20", lineWidth: 6, lineCap: "round", lineJoin: "round" });
        mapTex.needsUpdate = true;

        glowCtx.fillStyle = "#000";
        glowCtx.fillRect(0, 0, CW, CH);
        glowPath(glowCtx, engravePath, t, T.engrave, 11, 0.45);
        glowPath(glowCtx, cutPath, t, T.cut, 12, 0.35);
        glowTexW.needsUpdate = true;
      }

      // ------------------------------------------------------------------ particles = f(t)
      function updateParticles(t) {
        const cp = chipGeo.attributes.position.array;
        for (let i = 0; i < NCHIP; i++) {
          const life = 0.42 + 0.25 * hash(i + 11);
          const age = ((t + hash(i) * life) % life + life) % life;
          const tb = t - age;
          const hb = headState(tb);
          const on = hb.cutting && tb >= T.mill[0] && tb < T.mill[1] && t < T.mill[1] + 0.6;
          if (!on) { cp[i * 3 + 1] = -50; continue; }
          const [px, py, pz] = toolPoint(hb, SPINDLE_TIP);
          const ang = hash(i + 3) * Math.PI * 2;
          const sp = 0.6 + 0.9 * hash(i + 5);
          const vy = 0.5 + 0.9 * hash(i + 9);
          cp[i * 3] = px + Math.cos(ang) * sp * age;
          cp[i * 3 + 1] = Math.max(WP.y + 0.035, py + 0.03 + vy * age - 4.2 * age * age);
          cp[i * 3 + 2] = pz + Math.sin(ang) * sp * age;
        }
        chipGeo.attributes.position.needsUpdate = true;

        const spp = sparkGeo.attributes.position.array;
        const spc = sparkGeo.attributes.color.array;
        const lime = C(HEX.accent), white = new THREE.Color(1, 1, 1), vio = C(HEX.light);
        for (let i = 0; i < NSPARK; i++) {
          const life = 0.18 + 0.2 * hash(i + 21);
          const age = ((t + hash(i + 40) * life) % life + life) % life;
          const tb = t - age;
          const hb = headState(tb);
          if (hb.beam <= 0 || tb < T.engrave[0]) { spp[i * 3 + 1] = -50; spc[i * 3] = spc[i * 3 + 1] = spc[i * 3 + 2] = 0; continue; }
          const [px, , pz] = toolPoint(hb, 0);
          const ang = hash(i + 33) * Math.PI * 2;
          const sp = (0.5 + 1.4 * hash(i + 35)) * (0.7 + 0.3 * hb.beam);
          spp[i * 3] = px + Math.cos(ang) * sp * age;
          spp[i * 3 + 1] = WP.y + 0.04 + (0.7 + hash(i + 37)) * age - 3.0 * age * age;
          spp[i * 3 + 2] = pz + Math.sin(ang) * sp * age;
          const fade = 1 - age / life;
          const c = (i % 3 === 0 ? lime : i % 3 === 1 ? white : vio).clone().multiplyScalar(2.5 * fade);
          spc[i * 3] = c.r; spc[i * 3 + 1] = c.g; spc[i * 3 + 2] = c.b;
        }
        sparkGeo.attributes.position.needsUpdate = true;
        sparkGeo.attributes.color.needsUpdate = true;
      }

      // ================================================================== SCENE 3 — glass title + CTA
      const s3 = new THREE.Group();
      scene.add(s3);
      const titleMat = glass({ thickness: 1.5, dispersion: 1.2, attDist: 9, env: 1.6 });
      const titleGeo = glassTextGeometry("2в1", 2.0, 0.9, 0.12);
      const title = new THREE.Mesh(titleGeo, titleMat);
      {
        const bb = titleGeo.boundingBox;
        const wNow = bb.max.x - bb.min.x;
        const want = 4.75 * 0.78; // ~78% of the frame width at the title's distance
        title.scale.setScalar(want / wNow);
      }
      const titleGroup = new THREE.Group();
      titleGroup.add(title);
      s3.add(titleGroup);
      const s3Glow = new THREE.Mesh(new THREE.PlaneGeometry(15, 7), additive(HEX.primary, 0.9));
      s3Glow.position.set(0, 0.6, -3.5);
      s3Glow.renderOrder = -500;
      s3.add(s3Glow);

      const pill = new THREE.Group();
      s3.add(pill);
      const pillGlass = new THREE.Mesh(new RoundedBoxGeometry(3.0, 0.78, 0.78, 12, 0.389), glass({ thickness: 0.9, dispersion: 0.6, att: HEX.primary, attDist: 2.2, env: 1.4 }));
      pillGlass.scale.z = 0.62;
      pill.add(pillGlass);
      const coreShape = new THREE.Shape();
      {
        const w = 2.7, h = 0.5, r = 0.25;
        coreShape.moveTo(-w / 2 + r, -h / 2);
        coreShape.lineTo(w / 2 - r, -h / 2);
        coreShape.absarc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
        coreShape.lineTo(-w / 2 + r, h / 2);
        coreShape.absarc(-w / 2 + r, 0, r, Math.PI / 2, (3 * Math.PI) / 2, false);
      }
      const coreMat = new THREE.MeshBasicMaterial({ color: C(HEX.primary, 1.1) });
      const pillCore = new THREE.Mesh(new THREE.ShapeGeometry(coreShape, 24), coreMat);
      pillCore.position.z = -0.05;
      pill.add(pillCore);
      const pillHalo = new THREE.Mesh(new THREE.PlaneGeometry(6, 2.6), additive(HEX.primary, 0.6));
      pillHalo.position.z = -0.6;
      pillHalo.renderOrder = -400;
      pill.add(pillHalo);
      const PILL_Y = -0.9;

      // ------------------------------------------------------------------ DOM refs
      const flashEl = document.getElementById("flash");
      const vblurStd = document.getElementById("vblur-std");
      const hud = document.getElementById("hud");
      const kicker = document.querySelector("#kicker .kicker");
      const kickerClip = document.getElementById("kicker");
      const ctaClip = document.getElementById("cta");
      const ctaLabel = document.querySelector("#cta .cta-label");
      const ctaSub = document.querySelector("#cta .cta-sub");
      const kickerStart = parseFloat(kickerClip.dataset.start);
      const ctaStart = parseFloat(ctaClip.dataset.start);

      // ------------------------------------------------------------------ captions = f(t)
      function updateCaptions(t) {
        for (const c of captions) {
          const u = t - c.start;
          if (u < 0 || u >= c.dur) { c.plate.style.opacity = "0"; continue; }
          const outK = seg(u, c.dur - 0.2, c.dur);
          let s, dy;
          if (c.accent) {
            s = lerp(1.32, 1, outBack(seg(u, 0, 0.38), 2.2));
            dy = 0;
          } else if (c.mode === 0) {
            s = lerp(0.86, 1, outBack(seg(u, 0, 0.42), 1.9));
            dy = 0;
          } else {
            s = 1;
            dy = lerp(46, 0, outExpo(seg(u, 0, 0.5)));
          }
          s *= lerp(1, 0.96, outK);
          const op = clamp01(u / 0.1) * (1 - outK);
          c.plate.style.opacity = op.toFixed(3);
          c.plate.style.transform = `translate(-50%, -50%) translateY(${dy.toFixed(2)}px) scale(${s.toFixed(4)})`;
          c.words.forEach((w, i) => {
            const k = outExpo(seg(u, 0.04 + i * 0.075, 0.24 + i * 0.075));
            const blur = 10 * (1 - k) + 8 * outK;
            w.style.opacity = (k * (1 - outK)).toFixed(3);
            w.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
          });
        }
      }

      // ------------------------------------------------------------------ the frame: render(t)
      const tmpV = new THREE.Vector3();
      const tmpT = new THREE.Vector3();
      // Orbit speed (rad/s) along the scene; the angle is its integral, so it is a pure function of t.
      const PHI0 = -0.62;
      const S2_VEL = [
        [6.8, 0.16],
        [12.3, 0.14],
        [12.8, 0.05],
        [16.8, 0.05],
        [18.3, 0.45],
        [23, 0.45],
      ];
      const velAt = (t) => {
        if (t <= S2_VEL[0][0]) return S2_VEL[0][1];
        for (let i = 1; i < S2_VEL.length; i++) {
          if (t <= S2_VEL[i][0]) {
            const [t0, v0] = S2_VEL[i - 1], [t1, v1] = S2_VEL[i];
            return lerp(v0, v1, smooth((t - t0) / (t1 - t0)));
          }
        }
        return S2_VEL[S2_VEL.length - 1][1];
      };
      const orbitAngle = (t) => {
        const t0 = 6.8;
        if (t <= t0) return PHI0;
        const n = 240;
        const dt = (t - t0) / n;
        let a = PHI0;
        for (let i = 0; i < n; i++) a += velAt(t0 + (i + 0.5) * dt) * dt;
        return a;
      };
      const CAM_R = 13.4;
      const CAM_Y = 3.1;
      const cubeC = new THREE.Vector3(0, -0.2, 0);
      // fixed look points (s2-local): the tool holder during the head swap, and the board centre
      const swapPoint = (() => {
        const tp = toolPoint(headState(13.5), -0.1);
        return new THREE.Vector3(tp[0], machine.position.y + tp[1], tp[2]);
      })();
      const workCenter = new THREE.Vector3(0, machine.position.y + WP.y, WP.z);
      // the cube flies in along the camera's line of sight at the moment of the cut
      const flyDir = new THREE.Vector3(Math.sin(PHI0) * CAM_R, CAM_Y + 0.2, Math.cos(PHI0) * CAM_R).normalize();

      function render(t) {
        const flash = flashAt(t);
        const shake = shakeAt(t);
        const sceneIdx = t < T.cut1 ? 1 : t < T.cut2 ? 2 : 3;

        s1.visible = sceneIdx === 1;
        s2.visible = sceneIdx === 2;
        s3.visible = sceneIdx === 3;

        // camera float, always on
        const fx = 0.11 * Math.sin(t * 0.53 + 0.4) + 0.05 * Math.sin(t * 1.31 + 2.1);
        const fy = 0.08 * Math.sin(t * 0.71 + 1.3) + 0.03 * Math.sin(t * 1.77);
        const fz = 0.1 * Math.sin(t * 0.37 + 0.7);
        let viewShift = 0;

        if (sceneIdx === 1) {
          // ---- hook: digit slams in, flips 2 -> 1, then dives through the lens
          let z;
          if (t < T.hookImpact) z = lerp(-16, 0.9, Math.pow(seg(t, 0, T.hookImpact), 2));
          else z = lerp(0.9, 0, outBack(seg(t, T.hookImpact, T.hookImpact + 0.65), 2.2));
          const exitK = inCubic(seg(t, ...T.s1Exit));
          z = lerp(z, 13.6, exitK);
          const arrive = seg(t, 0, T.hookImpact);
          digitPivot.position.set(0, 0.35, z);
          const squash = t >= T.hookImpact ? 0.07 * Math.exp(-(t - T.hookImpact) / 0.09) : 0;
          digitPivot.scale.set(1 + squash, 1 - squash * 0.6, 1);
          const flipK = outBack(seg(t, ...T.flip), 1.4);
          const theta = Math.PI * flipK;
          const drift = 0.2 * (outCubic(seg(t, 0.35, 3.5)) - 0.5) * (1 - seg(t, 3.4, 3.6));
          digitPivot.rotation.set(lerp(-0.55, 0, outExpo(arrive)) + 0.12 * exitK, lerp(0.7, 0, outExpo(arrive)) + drift + theta, 0);
          two.visible = theta < Math.PI / 2;
          one.visible = !two.visible;
          s1Glow.material.color.copy(C(HEX.primary, 0.7 + 0.6 * flash));
          camera.position.set(fx, 0.35 + fy, 12 + fz);
          camera.lookAt(0, 0.35, 0);
          viewShift = 255;
        } else if (sceneIdx === 2) {
          // ---- machine inside the thick glass cube, camera orbits
          const inK = outExpo(seg(t, ...T.s2In));
          const exitK = inCubic(seg(t, ...T.s2Exit));
          const far = 45 * (1 - inK);
          s2.position.set(-flyDir.x * far, lerp(0, 13, exitK) - flyDir.y * far, -flyDir.z * far);
          s2.rotation.y = lerp(-1.3, 0, inK);

          const h = headState(t);
          gantry.position.z = h.z + WP.z - holderZ;
          carriage.position.x = h.x;
          zaxis.position.y = h.zh;
          const spinA = Math.PI * 2 * 1.35 * Math.max(0, Math.min(t, T.spOut[0]) - 7.7) * smooth(seg(t, 7.7, 8.4));
          spinner.rotation.y = spinA;
          const ko = inCubic(seg(t, ...T.spOut));
          spindle.visible = ko < 1;
          spindle.scale.setScalar(Math.max(0.0001, 1 - ko));
          spindle.position.y = holderY + 0.16 * ko;
          spindle.rotation.y = 3.2 * ko;
          const ki = seg(t, ...T.lzIn);
          laser.visible = ki > 0;
          laser.scale.setScalar(Math.max(0.0001, outBack(ki, 1.8)));
          laser.position.y = holderY + 0.3 * (1 - outExpo(ki));
          laser.rotation.y = -2.4 * (1 - outExpo(ki));

          const flick = 0.85 + 0.15 * Math.sin(t * 97.0) * Math.sin(t * 61.0 + 1.0);
          const bOn = h.beam * flick;
          const tipY = LASER_TIP;
          const workTopLocal = WP.y + 0.031 - (holderY + h.zh); // in laser-local coords
          const beamLen = Math.max(0.01, tipY - workTopLocal);
          beamCore.visible = beamGlow.visible = hot.visible = hotCore.visible = bOn > 0;
          beamCore.scale.y = beamGlow.scale.y = beamLen;
          beamCore.position.y = beamGlow.position.y = tipY - beamLen / 2;
          beamGlowMat.color.copy(C(HEX.primary, 1.6 * bOn));
          hot.position.y = workTopLocal + 0.004;
          hotCore.position.y = workTopLocal + 0.005;
          hot.material.color.copy(C(HEX.light, 2.2 * bOn));
          hotCore.material.color.copy(C(HEX.accent, 2.6 * bOn));
          laserLight.position.y = workTopLocal + 0.06;
          laserLight.intensity = 3.0 * bOn;

          drawWork(t);
          updateParticles(t);
          pool.material.color.copy(C(HEX.primary, 0.42 + 0.5 * flash));

          // camera: orbit + push-in on the head swap + crane up over the engraving + pull back for the hero view
          const phi = orbitAngle(t);
          const push = inOutCubic(seg(t, 12.45, 13.5)) - inOutCubic(seg(t, 15.4, 16.9));
          const engr = (inOutCubic(seg(t, 14.5, 15.4)) - inOutCubic(seg(t, 17.0, 18.2))) * (1 - push);
          const back = inOutCubic(seg(t, 18.55, 20.4));
          const R = CAM_R - 3.9 * push - 2.4 * engr + 1.0 * back;
          const y = CAM_Y - 1.2 * push + 2.4 * engr + 1.4 * back;
          // look target: cube centre, the tool holder during the swap, the board while it engraves
          const w1 = push;
          const w2 = 0.8 * engr;
          tmpT.copy(cubeC).multiplyScalar(1 - w1 - w2).addScaledVector(swapPoint, w1).addScaledVector(workCenter, w2);
          camera.position.set(tmpT.x + R * Math.sin(phi) + fx, tmpT.y + y + fy, tmpT.z + R * Math.cos(phi) + fz);
          camera.lookAt(tmpT);
          viewShift = lerp(190, 300, Math.max(push, engr));
        } else {
          // ---- final: glass title rises in, CTA pill pops, press
          const k = seg(t, ...T.s3In);
          titleGroup.position.set(0, lerp(-8, 0.95, outBack(k, 1.3)), 0);
          titleGroup.rotation.set(lerp(0.65, 0, outExpo(k)), lerp(-0.25, 0, outExpo(k)), 0);
          const kp = seg(t, ...T.ctaIn);
          const pressDown = t < T.press ? 0 : t < T.press + 0.09 ? seg(t, T.press, T.press + 0.09) : 1 - outBack(seg(t, T.press + 0.09, T.press + 0.6), 2.6);
          const ps = Math.max(0.0001, outBack(kp, 1.7)) * (1 - 0.07 * pressDown);
          pill.visible = kp > 0;
          pill.scale.setScalar(ps);
          pill.position.set(0, PILL_Y - 0.6 * (1 - outExpo(kp)), 0.3 - 0.12 * pressDown);
          const pressGlow = t >= T.press ? Math.exp(-(t - T.press) / 0.35) : 0;
          coreMat.color.copy(C(HEX.primary, 1.05 + 0.9 * pressGlow + 0.25 * Math.sin(t * 2.2) * smooth(seg(t, 28, 29))));
          s3Glow.material.color.copy(C(HEX.primary, 0.9 + 0.6 * flash));
          camera.position.set(fx, 0.2 + fy, 12.6 + fz);
          camera.lookAt(0, 0.2, 0);
          viewShift = 130;
        }

        // shake on accents (camera-space jitter + roll)
        if (shake > 0.001) {
          tmpV.set(0.15 * wobble(t, 91.7, 143.3, 0.3), 0.12 * wobble(t, 83.1, 131.9, 1.7), 0).multiplyScalar(shake);
          tmpV.applyQuaternion(camera.quaternion);
          camera.position.add(tmpV);
          camera.rotateZ(0.02 * shake * wobble(t, 77.3, 119.1, 2.9));
        }
        camera.rotateZ(0.01 * Math.sin(t * 0.43 + 0.2));
        camera.setViewOffset(W, H, 0, viewShift, W, H);
        camera.updateProjectionMatrix();

        scene.environmentRotation.set(0, 0.32 * t + 0.6, 0);
        renderer.toneMappingExposure = 1.0 + 0.5 * flash;
        bgMat.uniforms.uTime.value = t;
        bgMat.uniforms.uFlash.value = flash;
        // whip: the ribbons accelerate upward into the cut and decelerate after it (speeds matched at the seam)
        bgMat.uniforms.uScroll.value = 1.2 * inCubic(seg(t, T.s2Exit[0], T.cut2)) + 1.47 * outExpo(seg(t, T.cut2, T.cut2 + 0.85));

        renderer.render(scene, camera);

        // ---- HTML layer
        // whip smear: peaks on the cut, horizontal blur 0, vertical up to 22 px
        const smear = 22 * Math.exp(-Math.pow((t - T.cut2) / 0.09, 2));
        if (smear > 0.4) {
          vblurStd.setAttribute("stdDeviation", `0 ${smear.toFixed(2)}`);
          canvas.style.filter = "url(#vblur)";
        } else {
          canvas.style.filter = "none";
        }
        flashEl.style.opacity = Math.min(1, 0.62 * flash).toFixed(3);
        const hx = 7 * shake * wobble(t, 88.1, 127.7, 4.1);
        const hy = 6 * shake * wobble(t, 79.9, 141.3, 5.3);
        hud.style.transform = shake > 0.001 ? `translate(${hx.toFixed(2)}px, ${hy.toFixed(2)}px)` : "none";
        updateCaptions(t);

        const ku = t - kickerStart;
        const kk = outExpo(seg(ku, 0, 0.6));
        kicker.style.opacity = (ku >= 0 ? kk : 0).toFixed(3);
        kicker.style.letterSpacing = `${lerp(0.42, 0.22, kk).toFixed(3)}em`;
        kicker.style.filter = kk < 0.999 ? `blur(${(8 * (1 - kk)).toFixed(2)}px)` : "none";

        if (sceneIdx === 3 && t >= ctaStart) {
          tmpV.set(0, 0, 0);
          pill.localToWorld(tmpV);
          tmpV.project(camera);
          const sx = (tmpV.x * 0.5 + 0.5) * W;
          const sy = (-tmpV.y * 0.5 + 0.5) * H;
          const lk = outExpo(seg(t, ctaStart + 0.32, ctaStart + 0.75));
          const ps = pill.scale.x;
          ctaLabel.style.left = `${sx.toFixed(2)}px`;
          ctaLabel.style.top = `${sy.toFixed(2)}px`;
          ctaLabel.style.opacity = lk.toFixed(3);
          ctaLabel.style.filter = lk < 0.999 ? `blur(${(10 * (1 - lk)).toFixed(2)}px)` : "none";
          ctaLabel.style.transform = `translate(-50%, -50%) scale(${(ps * lerp(0.92, 1, lk)).toFixed(4)})`;
          const sk = outExpo(seg(t, ctaStart + 0.7, ctaStart + 1.2));
          ctaSub.style.opacity = (0.85 * sk).toFixed(3);
          ctaSub.style.transform = `translate(-50%, -50%) translateY(${lerp(18, 0, sk).toFixed(2)}px)`;
        }
      }

      // ------------------------------------------------------------------ warm-up, then hand over
      for (const tWarm of [0.5, 10.5, 15.5, 24, 30]) render(tWarm);
      await renderer.compileAsync(scene, camera);
      const px = new Uint8Array(4);
      renderer.getContext().readPixels(0, 0, 1, 1, renderer.getContext().RGBA, renderer.getContext().UNSIGNED_BYTE, px);
      host.render = render;
      host.lastT = NaN;
      render(host.pendingT || 0);
      host.lastT = host.pendingT || 0;
      host.ready();
    </script>
  </body>
</html>
